# Defines the different containers that make up your backend infrastructure
services:

  # ---------------- PostgreSQL Database ----------------
  postgres:
    # Pulls the official PostgreSQL version 15 image
    image: postgres:15
    environment:
      # Sets the default superuser name
      POSTGRES_USER: postgres
      # Sets the password for the superuser
      POSTGRES_PASSWORD: postgres
      # Automatically creates a database named 'app' on initial startup
      POSTGRES_DB: app
    ports:
      # Maps your local machine's port 5433 to the container's standard port 5432
      - "5433:5432"
    volumes:
      # Persists database files to the host machine so data survives container restarts
      - postgres_data:/var/lib/postgresql/data

  # ---------------- Redis Cache/Queue ----------------
  redis:
    # Pulls the official Redis version 7 image
    image: redis:7
    ports:
      # Maps your local machine's port 6379 to the container's standard port 6379
      - "6379:6379"
    volumes:
      # Persists Redis in-memory data to disk on the host machine
      - redis_data:/data

  # ---------------- Apache Kafka (Event Stream) ----------------
  kafka:
    # Uses the official Apache Kafka image, version 4.3.1
    image: apache/kafka:4.3.1
    environment:
      # The unique identifier for this specific server in the cluster
      KAFKA_NODE_ID: 1
      # KRaft mode: tells this node to handle both message data (broker) and cluster metadata (controller)
      KAFKA_PROCESS_ROLES: broker,controller
      # The IP/ports the container binds to internally (9092 for apps, 9093 for internal KRaft)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093      
      # The address handed to your Node.js app telling it exactly where to send messages
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      # Specifies which of the listeners above is dedicated to the KRaft controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Defines the voting members for cluster consensus (Node 1 is at localhost:9093)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      
      # Maps the listener names to security protocols (PLAINTEXT means unencrypted traffic)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Set to 1 because there is only one broker; we cannot replicate internal offsets to others
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Set to 1 because there is only one broker; we cannot replicate transaction logs
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # Minimum in-sync replicas required for transactions to succeed (1 for single-node dev)
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Set to 0 to prevent Kafka from pausing on startup waiting for non-existent brokers to join
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The default number of parallel splits/partitions assigned to any newly created topic
      KAFKA_NUM_PARTITIONS: 3

    ports:
      # Maps your local machine's port 9092 to the container's internal port 9092
      - "9092:9092"

    volumes:
      # Persists the Kafka topic data and logs to your host machine
      - kafka_data:/tmp/kraft-combined-logs

# Declares the named volumes referenced in the services above
volumes:
  # Instructs Docker to allocate space on your host machine for these specific storage buckets
  postgres_data:
  redis_data:
  kafka_data: